# bind prefix to ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# fast sourcing bind
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

# necessities
set -g mouse on
set -g set-clipboard on
set-option -g default-terminal "screen-256color"
set-option -g mode-style "fg=black,bg=#8aadf4"
set-option -g message-style "bg=#8aadf4,fg=black"

# copy pasting
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Copy mode with line numbers
unbind [
bind [ run-shell "~/.config/tmux/tmux-scripts/copy_mode_with_line_numbers.sh"

#styling
# set-option -g status-style bg=default
# set -g status-right '%a %Y-%m-%d %H:%M #{tmux_mode_indicator}'
# set -g pane-active-border-style "bg=default fg=magenta"

# make windows and panes 1-indexed
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind '\' split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
unbind %
unbind '"'

#pane movement
unbind -n b
bind j  select-pane -U
bind k  select-pane -D
bind h  select-pane -L
bind l  select-pane -R

# resize panes binds
bind-key -r -T prefix C-j resize-pane -U 5
bind-key -r -T prefix C-k resize-pane -D 5
bind-key -r -T prefix C-h resize-pane -L 5
bind-key -r -T prefix C-l resize-pane -R 5


# copy mode bindings for vim
# credit to https://www.reddit.com/r/vim/comments/12eg832/comment/jfd1m40/?utm_source=share&utm_medium=web3x&utm_name=web3xcss&utm_term=1&utm_content=share_button
bind -T copy-mode-vi i switch-client -T copyModeMultiKey_i
bind -T copyModeMultiKey_i w send-keys -X select-word
bind -T copyModeMultiKey_i W send-keys -X clear-selection \; send-keys -X previous-space \; send-keys -X begin-selection \; send-keys -X next-space-end
bind -T copyModeMultiKey_i b send-keys -X clear-selection \; send-keys -X jump-to-backward '(' \; send-keys -X begin-selection \; send-keys -X jump-to-forward ')'
bind -T copyModeMultiKey_i ( send-keys -X clear-selection \; send-keys -X jump-to-backward '(' \; send-keys -X begin-selection \; send-keys -X jump-to-forward ')'
bind -T copyModeMultiKey_i ) send-keys -X clear-selection \; send-keys -X jump-to-backward '(' \; send-keys -X begin-selection \; send-keys -X jump-to-forward ')'
bind -T copyModeMultiKey_i B send-keys -X clear-selection \; send-keys -X jump-to-backward '{' \; send-keys -X begin-selection \; send-keys -X jump-to-forward '}'
bind -T copyModeMultiKey_i \{ send-keys -X clear-selection \; send-keys -X jump-to-backward '{' \; send-keys -X begin-selection \; send-keys -X jump-to-forward '}'
bind -T copyModeMultiKey_i \} send-keys -X clear-selection \; send-keys -X jump-to-backward '{' \; send-keys -X begin-selection \; send-keys -X jump-to-forward '}'
bind -T copyModeMultiKey_i [ send-keys -X clear-selection \; send-keys -X jump-to-backward '[' \; send-keys -X begin-selection \; send-keys -X jump-to-forward ']'
bind -T copyModeMultiKey_i ] send-keys -X clear-selection \; send-keys -X jump-to-backward '[' \; send-keys -X begin-selection \; send-keys -X jump-to-forward ']'
bind -T copyModeMultiKey_i < send-keys -X clear-selection \; send-keys -X jump-to-backward '<' \; send-keys -X begin-selection \; send-keys -X jump-to-forward '>'
bind -T copyModeMultiKey_i > send-keys -X clear-selection \; send-keys -X jump-to-backward '<' \; send-keys -X begin-selection \; send-keys -X jump-to-forward '>'
bind -T copyModeMultiKey_i ` send-keys -X clear-selection \; send-keys -X jump-to-backward '`' \; send-keys -X begin-selection \; send-keys -X jump-to-forward '`'
bind -T copyModeMultiKey_i \' send-keys -X clear-selection \; send-keys -X jump-to-backward "'" \; send-keys -X begin-selection \; send-keys -X jump-to-forward "'"
bind -T copyModeMultiKey_i \" send-keys -X clear-selection \; send-keys -X jump-to-backward '"' \; send-keys -X begin-selection \; send-keys -X jump-to-forward '"'
bind -T copyModeMultiKey_i l send-keys -X clear-selection \; send-keys -X back-to-indentation \; send-keys -X begin-selection \; send-keys -X end-of-line \; send-keys -X cursor-left \; send-keys -X other-end

# plugins configs
set-option -g default-command 'reattach-to-user-namespace -l $SHELL'
set -g @session-wizard 'T'

# plugins!
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin '27medkamal/tmux-session-wizard'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'

set -g @minimal-tmux-justify "left"
set -g @minimal-tmux-indicator-str "  tmux  "
set -g @minimal-tmux-indicator true
set -g @minimal-tmux-status "bottom"

set -g @continuum-restore 'on'

# Enables or disables the left and right status bar
set -g @minimal-tmux-right true
set -g @minimal-tmux-left true

set -g @minimal-tmux-expanded-icon "󰊓 "

set -g @minimal-tmux-show-expanded-icons-for-all-tabs true

set -g @minimal-tmux-status-right-extra ""
set -g @minimal-tmux-status-left-extra ""

set -g @minimal-tmux-use-arrow true
set -g @minimal-tmux-right-arrow " "
set -g @minimal-tmux-left-arrow " "
set -g @minimal-tmux-left-padding "   "  
set -g @minimal-tmux-right-padding "   "

# Not recommended to change these values
set -g @minimal-tmux-status-right " #S "
set -g @minimal-tmux-status-left ""

# If getting strings cut in left status or right
set -g status-right-length 40
set -g status-left-length 30

run '~/.config/tmux/plugins/catppuccin-minimal-tmux/catppuccin.tmux'
run '~/.config/tmux/plugins/tpm/tpm'
