onboarding = false

[keys]
# tmux prefix C-a
prefix = "ctrl+a"

# tmux bind r source-file ...
reload_config = "prefix+r"

# tmux splits: backslash side by side, minus stacked.
split_vertical = "prefix+backslash"
split_horizontal = "prefix+minus"

# Keep the tmux pane navigation keys.
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_left = "prefix+h"
focus_pane_right = "prefix+right"
rename_pane = "prefix+comma"
rename_workspace = "prefix+shift+4"
previous_workspace = "prefix+up"
next_workspace = "prefix+down"

# tmux resize: C-j grows upward, C-k downward, C-h left, C-l right.
resize_pane_up = "prefix+ctrl+j"
resize_pane_down = "prefix+ctrl+k"
resize_pane_left = "prefix+ctrl+h"
resize_pane_right = "prefix+ctrl+l"

# tmux copy-mode entry and selection use Herdr's built-in tmux-like copy mode.
copy_mode = "prefix+["

[theme]
name = "catppuccin"

[theme.custom]
accent = "#8aadf4"
blue = "#8aadf4"
text = "#cad3f5"
subtext0 = "#a5adcb"
mauve = "#c6a0f6"
red = "#ed8796"
green = "#a6da95"
yellow = "#eed49f"
surface0 = "#363a4f"
surface1 = "#494d64"
panel_bg = "reset"
sidebar_bg = "reset"

[ui]
# tmux status line is at the bottom.
tab_bar_position = "bottom"
sidebar_collapsed_mode = "hidden"
tab_bar_right = [
  { type = "command", command = "\"$HERDR_BIN_PATH\" workspace get \"$HERDR_ACTIVE_WORKSPACE_ID\" | jq -r '.result.workspace.label // empty'", interval_seconds = 3, timeout_seconds = 2 },
]

# Match tmux mouse support and visible pane boundaries.
mouse_capture = true
pane_borders = "off"
pane_outer_borders = false


[[keys.command]]
key = "prefix+T"
type = "plugin_action"
command = "daleyu.herdr-explorer.general-search"
description = "search Herdr targets"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "daleyu.herdr-explorer.agents"
description = "jump to an agent"

[[keys.command]]
key = "prefix+L"
type = "plugin_action"
command = "daleyu.herdr-explorer.previous-workspace"
description = "toggle previous workspace"

