# Per-application keyd overrides, applied by keyd-application-mapper
# (started from hyprland.lua; needs your user in the `keyd` group).
#
# Everywhere else the thumb key is the [cmd] layer and sends Control.
# In Ghostty the thumb key is Alt, as it was before the [cmd] layer
# existed, because the tmux/herdr shortcuts in the Ghostty config are
# all Alt + key. Only thumb+C / thumb+V (copy / paste, on physical i
# and period) keep their [cmd] meaning there.
#
# Left side is the physical key, right side is what Ghostty sees.

[com-mitchellh-ghostty]

cmd.q = A-'
cmd.w = A-,
cmd.e = A-.
cmd.r = A-p
cmd.t = A-y
cmd.y = A-f
cmd.u = A-g
cmd.o = A-r
cmd.p = A-l
cmd.[ = A-/
cmd.a = A-a
cmd.s = A-o
cmd.d = A-e
cmd.f = A-u
cmd.g = A-i
cmd.h = A-d
cmd.j = A-h
cmd.k = A-t
cmd.l = A-n
cmd.; = A-s
cmd.z = A-;
cmd.x = A-q
cmd.c = A-j
cmd.v = A-k
cmd.b = A-x
cmd.n = A-b
cmd.m = A-m
cmd., = A-w
cmd./ = A-z

cmd.1 = A-1
cmd.2 = A-2
cmd.3 = A-3
cmd.4 = A-4
cmd.5 = A-5
cmd.6 = A-6
cmd.7 = A-7
cmd.8 = A-8
cmd.9 = A-9
cmd.0 = A-0
cmd.- = A--
cmd.= = A-=
cmd.] = A-]
cmd.' = A-'
cmd.\ = A-\

cmd.backspace = A-backspace
cmd.kpplus = A-kpplus
